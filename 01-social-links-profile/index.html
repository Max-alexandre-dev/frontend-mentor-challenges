<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Links Profile</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body class="min-h-screen flex items-center justify-center p-6">

    <!-- Card Principal -->
    <main class="bg-card w-full max-w-sm rounded-xl p-6 sm:p-10 text-center">
      
      <!-- Foto de Perfil-->
      <img 
        src="/images/avatar-jessica.png" 
        alt="Foto de Jessica Randall"
        class="w-20 h-20 rounded-full mx-auto mb-6"  
      >

      <!-- Informações do perfil-->
      <h1 class="text-2xl font-bold mb-2">
        Jessica Randall
      </h1>

      <p class="text-primary font-semibold mb-6">
        London, United Kingdom
      </p>

      <p class="text-sm mb-6">
        "Front-end developer and avid reader."
      </p>

      <!-- Redes sociais -->
      <nav aria-label="Rdes sociais">
        <ul class="flex flex-col gap-4">
          <li>
            <a href="https://github.com"
               class="block bg-button p-3 rounded-lg font-bold
                      hover:bg-primary hover:text-dark
                      focus-visible:bg-primary focus-visible:text-dark
                      transition-colors duration-200" 
            >
              GitHub
            </a>
          </li>
          <li>
            <a href="https://github.com"
               class="block bg-button p-3 rounded-lg font-bold
                      hover:bg-primary hover:text-dark
                      focus-visible:bg-primary focus-visible:text-dark
                      transition-colors duration-200" 
            >
              Frontend Mentor
            </a>
          </li>
          <li>
            <a href="https://linkedin.com"
               class="block bg-button p-3 rounded-lg font-bold
                      hover:bg-primary hover:text-dark
                      focus-visible:bg-primary focus-visible:text-dark
                      transition-colors duration-200" 
            >
              Linkedin
            </a>
          </li>
          <li>
            <a href="https://x.com"
               class="block bg-button p-3 rounded-lg font-bold
                      hover:bg-primary hover:text-dark
                      focus-visible:bg-primary focus-visible:text-dark
                      transition-colors duration-200" 
            >
              Twitter
            </a>
          </li>
          <li>
            <a href="https://instagram.com"
               class="block bg-button p-3 rounded-lg font-bold
                      hover:bg-primary hover:text-dark
                      focus-visible:bg-primary focus-visible:text-dark
                      transition-colors duration-200" 
            >
              Instagram
            </a>
          </li>
        </ul>
      </nav>
    </main>
    
  </body>
</html>
